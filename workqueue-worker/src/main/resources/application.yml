spring:
  application:
    name: workqueue-worker
  main:
    web-application-type: none
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10s
      lettuce:
        pool:
          max-active: 8

workqueue:
  default-max-attempts: 3
  worker:
    workers: 3
    poll-timeout-seconds: 5
    shutdown-timeout-seconds: 30